# netlify.toml

# For deploying a Docker container with a Dockerfile in the root of your repository:
# 1. Ensure your Netlify site's "Build & deploy" settings (in the Netlify UI)
#    are configured to use Docker. Look for an option like "Deploy with Docker"
#    or "Build with Docker image".
# 2. Netlify should then automatically detect and use your Dockerfile.
#    The CMD instruction in your Dockerfile will be used to run your application.
#    The EXPOSE instruction in your Dockerfile tells Netlify which port your application listens on.

# The [build] section can often be omitted when Netlify is correctly configured
# for Dockerfile-based deploys via its UI, as it will use the Dockerfile directly.
# If you include it, keep it minimal.
[build]
  # No explicit 'command' or 'publish' directory is typically needed here,
  # as these are handled by the Dockerfile and container runtime.
  # If Netlify's build system attempts to run other build tools (e.g., for Python or Node)
  # despite the presence of a Dockerfile, it usually means the Netlify UI setting
  # for Docker deployment is not active or is being overridden.

# The [dev] block is for the `netlify dev` command for local development emulation.
# It does not directly affect how Netlify builds or deploys your Docker container in the cloud.
[dev]
  # framework = "#custom" # Let Netlify auto-detect or set this if `netlify dev` is used.
  # Setting a targetPort can be helpful for `netlify dev` to proxy to your running container.
  # targetPort = 8080 # Assuming your app in Docker runs on port 8080.
