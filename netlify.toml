# netlify.toml

# Tell Netlify to use Docker to build and deploy this site.
[build]
  # This tells Netlify to look for a Dockerfile and use it.
  # Netlify will build the Docker image and deploy it.
  # No specific 'command' is needed here if the Dockerfile has a CMD.
  # publish directory is not relevant for a Docker deployment in this manner.

# Settings for the deployed service.
# Netlify automatically detects the port exposed by the Docker container (via EXPOSE in Dockerfile).
# However, if explicit configuration is needed or for clarity:
[dev]
  framework = "#custom" # Using custom framework since it's Docker
  # The command to start your app for local dev, not directly used for Docker deployment by Netlify
  # but can be useful for `netlify dev`
  # command = "docker compose up" # Example if you had a docker-compose for local dev
  # targetPort = 8080 # The port your app runs on inside the container

# It's important to note that for Docker deployments on Netlify,
# most of the configuration (like start command) comes from the Dockerfile itself.
# Environment variables must be set in the Netlify UI under site settings.

# If your Docker container listens on a port other than 80, Netlify should detect it
# from the EXPOSE instruction in your Dockerfile.
# If a specific port needs to be mapped or if there are issues,
# further Netlify-specific Docker settings might be required,
# but this basic toml is the starting point for Dockerfile-based deploys.
